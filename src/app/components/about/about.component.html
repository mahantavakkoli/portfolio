      <div class="about-info mt-10 grid gap-4 sm:grid-cols-3">
        @for (item of info(); track item.key) {
          <div
            class="rounded-2xl border border-slate-200 bg-white/70 p-4 text-center shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/60 sm:text-start"

            </svg>
            <p

            >
              {{ item.labelKey | translate }}

            <p class="mt-1 font-semibold text-slate-800 dark:text-slate-100">{{ item.value }}</p>
