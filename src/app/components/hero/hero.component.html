<section
  id="home"
  class="relative mx-auto flex min-h-[100svh] max-w-6xl flex-col items-center justify-center px-4 pb-24 pt-24 text-center sm:px-6 lg:px-8"
>
  <div class="hero-parallax w-full max-w-3xl">
    <div class="hero-tilt w-full">
      <!-- <p
        class="hero-badge hero-depth-2 inline-flex items-center gap-2.5 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-4 py-1.5 text-xs font-semibold text-emerald-700 dark:border-emerald-400/20 dark:bg-emerald-400/10 dark:text-emerald-300"
      >
        <span class="relative flex h-2 w-2">
          <span
            class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-500 opacity-75"
          ></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
        </span>
        {{ 'HERO.AVAILABLE' | translate }}
      </p> -->
      <p class="about-greeting inline-flex items-center justify-center gap-2 text-sm font-semibold uppercase tracking-widest text-indigo-500 dark:text-indigo-400 md:justify-start">
        <svg class="h-4 w-4" aria-hidden="true"><use href="#icon-globe"></use></svg>
        {{ profileService.heroGreeting() }}
      </p>

      <h1
        class="hero-name hero-depth-3 mt-8 text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white sm:text-6xl md:text-7xl"
      >
        {{ profileService.name() }}
      </h1>

      <p
        class="hero-role hero-depth-2 mt-5 bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500 bg-clip-text text-2xl font-bold text-transparent dark:from-indigo-400 dark:via-violet-400 dark:to-fuchsia-400 sm:text-3xl"
      >
        {{ profileService.heroTitle() }}
      </p>

      <p
        class="hero-tagline hero-depth-1 mx-auto mt-6 max-w-2xl text-base leading-relaxed text-slate-600 dark:text-slate-300 sm:text-lg"
      >
        {{ profileService.heroTagline() }}
      </p>

      <div class="hero-cta hero-depth-2 mt-10 flex flex-wrap items-center justify-center gap-4">
        <a
          href="#contact"
          class="group inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 px-7 py-3.5 text-sm font-semibold text-white shadow-lg shadow-indigo-500/30 transition-[scale,box-shadow] duration-300 hover:scale-105 hover:shadow-xl hover:shadow-indigo-500/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-950"
        >
          {{ 'NAV.CONTACT' | translate }}
          <svg
            class="h-4 w-4 transition-transform duration-300 group-hover:translate-x-0.5 rtl:group-hover:-translate-x-0.5"
            aria-hidden="true"
          >
            <use href="#icon-arrow-up-right"></use>
          </svg>
        </a>
        <a
          href="#projects"
          class="inline-flex items-center gap-2 rounded-full border border-slate-300 bg-white/80 px-7 py-3.5 text-sm font-semibold text-slate-700 backdrop-blur transition-colors duration-300 hover:border-indigo-400 hover:text-indigo-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:border-slate-700 dark:bg-slate-900/60 dark:text-slate-200 dark:hover:border-indigo-500 dark:hover:text-indigo-400"
        >
          {{ 'NAV.PROJECTS' | translate }}
          <svg class="h-4 w-4" aria-hidden="true"><use href="#icon-arrow-up-right"></use></svg>
        </a>
      </div>
    </div>
  </div>

  <a
    href="#about"
    [attr.aria-label]="'HERO.SCROLL' | translate"
    class="hero-scroll absolute bottom-8 left-1/2 flex -translate-x-1/2 flex-col items-center gap-1.5 rounded-full text-slate-400 transition-colors hover:text-indigo-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:text-slate-500 dark:hover:text-indigo-400"
  >
    <span class="text-[10px] font-semibold uppercase tracking-widest">{{
      'HERO.SCROLL' | translate
    }}</span>
    <svg class="hero-scroll-icon h-5 w-5" aria-hidden="true">
      <use href="#icon-chevron-down"></use>
    </svg>
  </a>
</section>
