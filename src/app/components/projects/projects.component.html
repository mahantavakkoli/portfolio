<section id="projects" class="relative mx-auto max-w-6xl scroll-mt-24 px-4 py-20 sm:px-6 lg:px-8">
  <div class="mb-12 text-center" data-reveal>
    <p class="text-sm font-semibold uppercase tracking-widest text-indigo-500 dark:text-indigo-400">{{ 'NAV.PROJECTS' | translate }}</p>
    <h2 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white sm:text-4xl">{{ 'PROJECTS.TITLE' | translate }}</h2>
    <div class="mx-auto mt-4 h-1 w-16 rounded-full bg-gradient-to-r from-indigo-500 to-violet-500"></div>
  </div>

  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" data-stagger>
    @for (project of profileService.projects(); track project.key) {
      <article class="group rounded-3xl border border-slate-200 bg-white/70 p-6 shadow-sm backdrop-blur transition-[translate,box-shadow] duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-slate-800 dark:bg-slate-900/60">
        <div class="mb-5 flex items-center justify-between">
          <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br text-white shadow-lg {{ project.accent }}" aria-hidden="true">
            <svg class="h-6 w-6"><use [attr.href]="'#icon-' + project.icon"></use></svg>
          </div>
          <span class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-semibold text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400">
            {{ project.tag }}
          </span>
        </div>
        <h3 class="text-lg font-bold text-slate-900 dark:text-white">{{ project.name }}</h3>
        <p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-300">{{ project.description }}</p>
      </article>
    }
  </div>
</section>
