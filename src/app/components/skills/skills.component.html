<section id="skills" class="relative mx-auto max-w-6xl scroll-mt-24 px-4 py-20 sm:px-6 lg:px-8">
  <div class="mb-10 text-center" data-reveal>
    <p class="text-sm font-semibold uppercase tracking-widest text-indigo-500 dark:text-indigo-400">{{ 'NAV.SKILLS' | translate }}</p>
    <h2 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white sm:text-4xl">{{ 'SKILLS.TITLE' | translate }}</h2>
    <div class="mx-auto mt-4 h-1 w-16 rounded-full bg-gradient-to-r from-indigo-500 to-violet-500"></div>
  </div>

  <div role="group" aria-label="{{ 'SKILLS.FILTER' | translate }}" class="mb-8 flex flex-wrap items-center justify-center gap-2" data-reveal>
    @for (category of profileService.categories(); track category.key) {
      <button
        type="button"
        (click)="filterSkills(category.key)"
        [attr.aria-pressed]="activeCategory() === category.key"
        [class]="activeCategory() === category.key ? 'bg-gradient-to-r from-indigo-500 to-violet-500 text-white shadow-lg shadow-indigo-500/25' : 'border border-slate-300 bg-white text-slate-600 hover:border-indigo-400 hover:text-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:text-indigo-400'"
        class="rounded-full px-4 py-2 text-sm font-semibold transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 cursor-pointer"
      >
        {{ category.label }}
      </button>
    }
  </div>

  <div class="relative flex flex-wrap items-center justify-center gap-3" [style.min-height.px]="pillsMinHeight()">
    <!-- Invisible copy of the FULL skill set: measured via ResizeObserver so the
         container keeps a stable height when switching categories (prevents the
         layout from jumping up/down as the pill count changes). Uses a separate
         class so it never matches .skill-pill (tests/GSAP filter animation). -->
    <div
      #fullSetPills
      aria-hidden="true"
      class="pointer-events-none invisible absolute inset-x-0 top-0 flex flex-wrap items-center justify-center gap-3"
    >
      @for (skill of profileService.skills(); track skill.name) {
        <span class="skill-pill-measure inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/80 px-5 py-2.5 text-sm font-medium text-slate-700 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/70 dark:text-slate-200">
          <span class="h-2.5 w-2.5 rounded-full {{ skill.color }}" aria-hidden="true"></span>
          {{ skill.name }}
        </span>
      }
    </div>

    @for (skill of filteredSkills(); track skill.name) {
      <span class="skill-pill inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/80 px-5 py-2.5 text-sm font-medium text-slate-700 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/70 dark:text-slate-200">
        <span class="h-2.5 w-2.5 rounded-full {{ skill.color }}" aria-hidden="true"></span>
        {{ skill.name }}
      </span>
    }
  </div>
</section>
